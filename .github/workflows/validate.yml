name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            requirements-local.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt -r requirements-local.txt
      - run: python -m pytest tests -q
      - run: python -m pip check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: python -m scripts.configure_env
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - run: docker compose up -d --build --wait --wait-timeout 240
      - run: |
          curl --fail http://localhost:8000/api/v1/health
          curl --fail http://localhost:3000/api/v1/health
          docker compose exec -T backend alembic current
          docker compose exec -T worker celery -A workers.scan_worker inspect ping --timeout=15
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
