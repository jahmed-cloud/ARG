# Production overlay for docker-compose.yml
# ===========================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences from base compose file:
#   - Postgres and Redis ports are NOT published to the host (internal only)
#   - Resource limits set on every service to prevent noisy-neighbor issues
#   - Backend worker count and connection pools fit the default resource budget
#   - Restart policy hardened to "always" (vs "unless-stopped") for prod resilience

services:
  postgres:
    ports: !reset []  # remove host port mapping — only reachable inside arg-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          memory: 512M

  redis:
    ports: !reset []
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  backend:
    ports: !reset []
    restart: always
    environment:
      UVICORN_WORKERS: "2"
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      APP_ENV: production
      LOG_LEVEL: warning
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          memory: 256M

  worker:
    restart: always
    environment:
      APP_ENV: production
      LOG_LEVEL: warning
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 768M

  beat:
    restart: always
    environment:
      APP_ENV: production
      LOG_LEVEL: warning
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
