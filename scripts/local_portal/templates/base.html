<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ARG Local Portal{% endblock %}</title>
  <link rel="stylesheet" href="/static/portal.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">A</span> ARG <span>Resource Guardian</span></a>
    <nav aria-label="Main navigation">
      <a href="/">Subscriptions</a>
      <a href="/estate">Estate</a>
      <a href="/reports/README.md">Reports</a>
    </nav>
    {% block user %}{% endblock %}
  </header>
  <main id="main-content" tabindex="-1" class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    Azure Resource Guardian (ARG) · Author: Junaid Ahmed ·
    <a href="https://jahmed.cloud" target="_blank" rel="noopener">jahmed.cloud</a> ·
    <a href="https://github.com/jahmed-cloud/ARG" target="_blank" rel="noopener">github.com/jahmed-cloud/ARG</a>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
